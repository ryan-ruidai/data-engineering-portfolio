name: Synthetic pipeline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pipeline.run
      - run: python -m pipeline.run
      - run: python -m commerce.run
      - run: python -m commerce.run
      - run: python -m commerce.run --batch late
      - run: python -m commerce.run --batch late
      - run: python -m commerce.recover --warehouse build/commerce/warehouse.sqlite --run-id 4 --out build/commerce/reports
